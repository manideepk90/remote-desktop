name: Viewer

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/viewer.yml"]
    tags: ["viewer-v*"]
  pull_request:
    paths: ["client/**", ".github/workflows/viewer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustc --version

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/viewer-v* && "${GITHUB_REF#refs/tags/viewer-v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match Cargo.toml version $version"
            exit 1
          fi
          name="remote-desk-viewer-$version-windows-x64"
          mkdir -p "dist/$name"
          cp target/release/remote-desk-viewer.exe "dist/$name/Remote Desk Viewer.exe"
          cp README.md "dist/$name/README.md"
          cp ../LICENSE "dist/$name/LICENSE.txt"
          cp target/release/remote-desk-viewer.exe "dist/$name.exe"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          (cd dist && sha256sum "$name.exe" "$name.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > dist/notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            client/dist/*.exe
            client/dist/*.zip
            client/dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/viewer-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=${{ steps.package.outputs.name }}
          gh release create "${GITHUB_REF#refs/tags/}" \
            "dist/$name.exe" "dist/$name.zip" dist/SHA256SUMS.txt \
            --title "Remote Desk Viewer ${{ steps.package.outputs.version }} for Windows" \
            --notes-file dist/notes.md
