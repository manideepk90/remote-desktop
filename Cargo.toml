[package]
name = "remote-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kuntimaddi Manideep"]
description = "A VNC server for KDE Plasma on Wayland, written from scratch in Rust"
license = "MIT"
repository = "https://github.com/manideepk90/remote-desktop"
keywords = ["vnc", "kde", "plasma", "wayland", "remote-desktop"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
des = "0.9.0"
env_logger = "0.11.11"
flate2 = "1.1.10"
log = "0.4.34"
pipewire = "0.10.1"
png = "0.18.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tiny_http = "0.12.0"
toml = "1.1.6"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-scanner = "0.31"
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
