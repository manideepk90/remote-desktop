[package]
name = "remote-desk-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kuntimaddi Manideep"]
description = "A VNC viewer for Windows, Linux and macOS with secure password storage"
license = "MIT"
repository = "https://github.com/manideepk90/remote-desktop"
keywords = ["vnc", "rfb", "remote-desktop", "viewer"]
categories = ["network-programming", "gui"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
des = "0.9.0"
directories = "6.0.0"
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
flate2 = "1.1.10"
keyring = "4.2.0"
log = "0.4.34"
md-5 = "0.11.0"
num-bigint = "0.5.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
env_logger = "0.11.11"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
